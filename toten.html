<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Toten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #2b57a7;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: Inter, system-ui, -apple-system, Arial, sans-serif;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tela {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      transform-origin: center;
      background: #2b57a7;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url("./img/fundo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      color: #fff;
      padding: 520px 120px 470px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .texto-apoio {
      font-size: 52px;
      opacity: .95;
      margin-bottom: 14px;
      text-shadow: 0 6px 16px rgba(0,0,0,.25);
    }

    .titulo {
      font-family: Montserrat, Inter, Arial, sans-serif;
      font-size: 96px;
      font-weight: 900;
      line-height: 1.03;
      margin-bottom: 34px;
      text-shadow: 0 10px 20px rgba(0,0,0,.22);
    }

    .menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 34px;
      margin-top: 6px;
    }

    .botao {
      width: 980px;
      padding: 46px 28px;
      border-radius: 28px;
      text-decoration: none;
      font-family: Montserrat, Inter, Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: .8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
      transition: transform .06s ease;
    }

    .botao:active {
      transform: scale(0.992);
    }

    /* azul médio — texto branco */
    .roxo {
      background: #5b8dd9;
      color: #ffffff;
    }

    /* azul bem claro — texto azul escuro */
    .azul {
      background: #ddeeff;
      color: #1a3a7a;
    }

    /* ── BOTÃO FLUTUANTE ── */

    #botaoFlutuante {
      position: fixed;
      top: 100px;
      left: 40px;
      width: 155px;
      height: 155px;
      border-radius: 50%;
      border: 4px solid #ffdf00;
      background-image: url("./img/imagem1.png");
      background-size: 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #1a3a80;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: grab;
      box-shadow:
        0 12px 30px rgba(0,0,0,.45),
        0 0 22px rgba(255,223,0,.55);
      animation: pulsar 2s infinite ease-in-out;
      user-select: none;
      -webkit-user-select: none;
    }

    #botaoFlutuante:active {
      cursor: grabbing;
    }

    /* brilho no topo */
    #botaoFlutuante::before {
      content: "";
      position: absolute;
      top: 12%;
      left: 18%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      filter: blur(6px);
      pointer-events: none;
    }

    /* anel pulsante externo */
    #botaoFlutuante::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(255,223,0,.5);
      animation: ring 2s infinite ease-out;
      pointer-events: none;
    }

    /* container do texto em arco */
    #botaoFlutuante .arco-texto {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    /* cada letra do arco */
    #botaoFlutuante .arco-texto span {
      position: absolute;
      left: 50%;
      top: 6px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffdf00;
      text-shadow: 0 1px 5px rgba(0,0,0,.9);
      transform-origin: 0 71.5px;
      font-family: Montserrat, Arial, sans-serif;
      text-transform: uppercase;
      pointer-events: none;
    }

    /* ── OVERLAY ── */

    #overlayFlutuante {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9998;
      background: rgba(0,0,0,0.2);
    }

    .container-imagens {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .img-base,
    .img-topo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
    }

    .img-topo { z-index: 2; }
    .img-base  { z-index: 1; }

    #fecharOverlay {
      position: absolute;
      top: 40px;
      right: 40px;
      font-size: 50px;
      color: #fff;
      z-index: 10000;
      cursor: pointer;
    }

    /* ── ANIMAÇÕES ── */

    @keyframes pulsar {
      0%   { transform: scale(1);
             box-shadow: 0 12px 30px rgba(0,0,0,.45), 0 0 22px rgba(255,223,0,.55); }
      50%  { transform: scale(1.06);
             box-shadow: 0 14px 36px rgba(0,0,0,.5),  0 0 32px rgba(255,223,0,.75); }
      100% { transform: scale(1);
             box-shadow: 0 12px 30px rgba(0,0,0,.45), 0 0 22px rgba(255,223,0,.55); }
    }

    @keyframes ring {
      0%   { transform: scale(1);   opacity: .7; }
      100% { transform: scale(1.5); opacity: 0;  }
    }

  </style>
</head>

<body>

  <div class="stage">
    <main class="tela" id="tela">

      <div class="bg"></div>

      <section class="overlay">

        <p class="texto-apoio">
          Toque na opção desejada e
        </p>

        <h1 class="titulo">
          descubra mais:
        </h1>

        <nav class="menu">

          <a class="botao roxo" href="graduacoes.html">
            GRADUAÇÕES
          </a>

          <a class="botao azul" href="pos.html">
            PÓS-GRADUAÇÕES
          </a>

          <a class="botao roxo"
             href="https://www.senacrs.com.br/unisenac/8d0ded17-fd8e-4d8d-8b1c-cacbf8c65a36"
             target="_blank"
             rel="noopener noreferrer">
            CURSOS LIVRES
          </a>

          <a class="botao azul" href="cursos-gratuitos.html">
            CURSOS GRATUITOS
          </a>

          <a class="botao roxo" href="unidades.html">
            CONHEÇA AS UNIDADES
          </a>

          <a class="botao azul" href="escola.html">
            ESCOLA SENAC
          </a>

        </nav>

      </section>

    </main>
  </div>

  <!-- BOTÃO FLUTUANTE -->
  <button id="botaoFlutuante" aria-label="Clique aqui">
    <div class="arco-texto" id="textoArco"></div>
  </button>

  <!-- OVERLAY -->
  <div id="overlayFlutuante">

    <div id="fecharOverlay">✕</div>

    <div class="container-imagens">
      <img src="./img/imagem1.png" class="img-base">
    </div>

  </div>

  <script>

    /* ── fit totem ── */
    function fitToten() {
      const tela = document.getElementById('tela');
      const scale = Math.min(
        window.innerWidth  / 1080,
        window.innerHeight / 1920
      );
      tela.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitToten);
    fitToten();

    /* ── texto em arco ── */
    const texto = "● CLIQUE AQUI ●";
    const containerTexto = document.getElementById("textoArco");
    const anguloTotal  = 160;
    const anguloInicial = -80;

    texto.split("").forEach((letra, i) => {
      const span = document.createElement("span");
      span.innerText = letra;
      const angulo = anguloInicial + (i * (anguloTotal / (texto.length - 1)));
      span.style.transform = `rotate(${angulo}deg)`;
      containerTexto.appendChild(span);
    });

    /* ── referências ── */
    const botao   = document.getElementById("botaoFlutuante");
    const overlay = document.getElementById("overlayFlutuante");
    const imgBase = document.querySelector(".img-base");
    const imgTopo = document.querySelector(".img-topo");
    const fechar  = document.getElementById("fecharOverlay");

    let etapa = 0;
    let intervalo;

    /* ── overlay ── */
    function abrirOverlay() {
      overlay.style.display = "flex";
      etapa = 1;
      imgBase.style.display = "block";
      if (imgTopo) imgTopo.style.display = "none";
      clearInterval(intervalo);
      intervalo = setInterval(() => {
        if (etapa === 1) {
          if (imgTopo) imgTopo.style.display = "block";
          etapa = 2;
        } else {
          if (imgTopo) imgTopo.style.display = "none";
          etapa = 1;
        }
      }, 180000);
    }

    overlay.addEventListener("click", () => {
      if (etapa === 1) {
        if (imgTopo) imgTopo.style.display = "block";
        etapa = 2;
      } else {
        if (imgTopo) imgTopo.style.display = "none";
        etapa = 1;
      }
    });

    fechar.addEventListener("click", (e) => {
      e.stopPropagation();
      overlay.style.display = "none";
      etapa = 0;
      clearInterval(intervalo);
    });

    /* ── drag + clique (não abre se arrastou) ── */
    let isDragging = false;
    let hasMoved   = false;
    let offsetX, offsetY;

    function startDrag(cx, cy) {
      isDragging = true;
      hasMoved   = false;
      botao.style.right  = "auto";
      botao.style.bottom = "auto";
      offsetX = cx - botao.offsetLeft;
      offsetY = cy - botao.offsetTop;
    }

    function moveDrag(cx, cy) {
      if (!isDragging) return;
      hasMoved = true;
      botao.style.left = (cx - offsetX) + "px";
      botao.style.top  = (cy - offsetY) + "px";
    }

    botao.addEventListener("mousedown", (e) => startDrag(e.clientX, e.clientY));
    document.addEventListener("mousemove", (e) => moveDrag(e.clientX, e.clientY));
    document.addEventListener("mouseup",   () => { isDragging = false; });

    botao.addEventListener("touchstart", (e) => {
      startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (isDragging) {
        e.preventDefault();
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    document.addEventListener("touchend", () => { isDragging = false; });

    botao.addEventListener("click", () => {
      if (hasMoved) return;
      abrirOverlay();
    });

  </script>

</body>
</html>
